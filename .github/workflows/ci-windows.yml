name: Windows CI (frontend)

# Builds the native Windows frontend: the Rust daemon (librepodsd) and the WinUI 3
# app (librepods-winui, which carries its own tray), and packs them with
# everything else into ONE self-contained install folder. The end user gets only
# that folder, so nothing may rely on tools installed on their PC (no WDK, no
# Windows SDK, no VC++ redistributable).
#
# The two kernel drivers (AAP L2CAP + hi-res mic) are NOT built here — they need
# the WDK. Their packages (.inf + .sys + .cat) are committed prebuilt and
# install.ps1 test-signs them on the user's machine.

on:
  push:
    branches: [main, windows-native]
    tags: ['windows-v*']
    paths:
      - 'windows/**'
      - '.github/workflows/ci-windows.yml'
  pull_request:
    paths:
      - 'windows/**'
  workflow_dispatch:

jobs:
  build:
    # NOTE: pinned to windows-2022, not windows-latest. As of ~Sep 2026,
    # windows-latest moved to Windows Server 2025 + Visual Studio 2026, whose
    # WDK/MSBuild integration for the classic WindowsKernelModeDriver10.0
    # toolset isn't there yet (MSB4062 loading Microsoft.DriverKit.Build.Tasks).
    # windows-2022 still ships VS2022 (17.x), which this driver project targets.
    # Revisit once WDK support for VS2026 is confirmed working.
    runs-on: windows-2022
    # Creating/updating GitHub Releases needs write access; the default
    # GITHUB_TOKEN is read-only on newer repos.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # ---- EXPERIMENTAL: actually build the hi-res mic driver from source ---
      # Upstream note (see header): the driver is normally NOT built here, its
      # prebuilt .sys/.inf/.cat are committed as-is. That means a source change
      # under windows/drivers/mic (e.g. a MicPipe.cpp fix) does nothing to the
      # shipped build unless someone rebuilds it locally with the WDK and
      # commits the new binary. This block does that rebuild on the runner
      # instead, using Microsoft's documented WinGet-based WDK install
      # (learn.microsoft.com/windows-hardware/drivers/install-the-wdk-using-winget),
      # then regenerates the catalog and overwrites windows/drivers/mic/prebuilt/
      # so the existing "Assemble install folder" step below picks up the fresh
      # build automatically. Not exercised by upstream CI yet — if a step here
      # fails, check the exact component/package IDs against the current WDK
      # docs, they occasionally bump with new Windows SDK releases.
      # windows-2022 (unlike windows-latest/windows-2025) doesn't ship winget
      # out of the box — install it first. This is the one third-party action
      # in this workflow; it's small and does exactly one documented thing
      # (github.com/Cyberboss/install-winget). Feel free to swap it for a
      # direct winget-cli download if you'd rather avoid marketplace actions.
      - name: Install winget
        uses: Cyberboss/install-winget@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Windows SDK + WDK (winget)
        shell: pwsh
        run: |
          winget install --source winget --exact --id Microsoft.WindowsSDK.10.0.26100 `
            --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -and $LASTEXITCODE -ne -1978335189) { throw "winget SDK install failed (exit $LASTEXITCODE)" }
          winget install --source winget --exact --id Microsoft.WindowsWDK.10.0.26100 `
            --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -and $LASTEXITCODE -ne -1978335189) { throw "winget WDK install failed (exit $LASTEXITCODE)" }
          # -1978335189 (0x8A15002B) = "no applicable update found" i.e. already installed — not a failure.

      # DIAGNOSTIC: dump everything about the winget install result in one shot —
      # what winget itself thinks got installed, and what's actually on disk
      # under Windows Kits\10 — so if the next step still fails we have full
      # info immediately instead of needing another round-trip to find out.
      - name: Diagnose WDK install
        shell: pwsh
        run: |
          Write-Host "==== winget list (SDK/WDK) ===="
          winget list --id Microsoft.WindowsSDK.10.0.26100 | Write-Host
          winget list --id Microsoft.WindowsWDK.10.0.26100 | Write-Host

          Write-Host "`n==== Windows Kits\10 top-level contents ===="
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10"
          if (Test-Path $kits) {
            Get-ChildItem $kits | Select-Object Name, LastWriteTime | Format-Table | Out-String | Write-Host
          } else {
            Write-Host "!! '$kits' does not exist at all."
          }

          Write-Host "`n==== Windows Kits\10\Vsix (any depth) ===="
          $vsixDir = Join-Path $kits 'Vsix'
          if (Test-Path $vsixDir) {
            Get-ChildItem $vsixDir -Recurse | Select-Object FullName | Out-String | Write-Host
          } else {
            Write-Host "!! '$vsixDir' does not exist."
          }

          Write-Host "`n==== Windows Kits\10\build (any depth, top 2 levels) ===="
          $buildDir = Join-Path $kits 'build'
          if (Test-Path $buildDir) {
            Get-ChildItem $buildDir -Recurse -Depth 2 | Select-Object FullName | Out-String | Write-Host
          } else {
            Write-Host "!! '$buildDir' does not exist."
          }

      - name: List installed Visual Studio instances
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -all -prerelease -products * -format json | Write-Host

      # NOTE: no VSIX install here anymore. WDK.vsix only wires up Visual
      # Studio IDE integration (New Project templates, IntelliSense, F5
      # debugging) — it's not needed for a plain command-line MSBuild
      # compile. The "Diagnose WDK install" step above already confirmed the
      # actual toolset files MSBuild needs (WindowsDriver.KernelMode.KMDF.props,
      # the WindowsKernelModeDriver platform folders, etc.) are present under
      # Windows Kits\10\build after the winget WDK install — that's sufficient.

      - name: Build hi-res mic driver (KMDF, x64 Release)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -version "[17.0,18.0)" -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild.exe not found via vswhere for VS2022 (17.x)" }
          Write-Host "Using MSBuild: $msbuild"
          & $msbuild windows/drivers/mic/AudioCodec/Driver/AudioCodec.sln /p:Configuration=Release /p:Platform=x64 /m
          if ($LASTEXITCODE) { throw "Driver build failed (exit $LASTEXITCODE)" }

      - name: Regenerate driver catalog + refresh the prebuilt package
        shell: pwsh
        run: |
          $out = 'windows/drivers/mic/AudioCodec/Driver/x64/Release'
          $sys = Join-Path $out 'AudioCodec.sys'
          $inf = Join-Path $out 'AudioCodec.inf'
          foreach ($f in @($sys, $inf)) { if (-not (Test-Path $f)) { throw "Missing $f after build" } }

          $inf2cat = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter Inf2Cat.exe |
            Where-Object { $_.FullName -match '\\x86\\' } | Select-Object -First 1
          if (-not $inf2cat) { throw "Inf2Cat.exe not found under Windows Kits" }

          $pkg = 'wdk-pkg'
          Remove-Item $pkg -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item $sys, $inf $pkg -Force
          & $inf2cat.FullName /driver:$pkg /os:10_X64
          $cat = Join-Path $pkg 'audiocodec.cat'
          if (-not (Test-Path $cat)) { throw "Inf2Cat did not produce audiocodec.cat" }

          # Overwrite the committed prebuilt package so make-dist.ps1 (further
          # below) bundles this freshly built driver instead of the old one.
          Copy-Item (Join-Path $pkg 'AudioCodec.sys') 'windows/drivers/mic/prebuilt/AudioCodec.sys' -Force
          Copy-Item (Join-Path $pkg 'AudioCodec.inf') 'windows/drivers/mic/prebuilt/AudioCodec.inf' -Force
          Copy-Item $cat                              'windows/drivers/mic/prebuilt/audiocodec.cat' -Force
          Write-Host "==> Freshly built LibrePodsMic driver copied into windows/drivers/mic/prebuilt/"

      # ---- Rust: daemon (native msvc target) ---------------------------------
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/daemon/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('windows/**/Cargo.lock') }}

      - name: Fetch FFmpeg (AAC-ELD decode libs — not vendored in git)
        shell: bash
        run: windows/daemon/fetch-ffmpeg.sh

      - name: Build daemon (librepodsd)
        working-directory: windows/daemon
        # Static CRT: otherwise the msvc build imports VCRUNTIME140.dll, which a
        # clean Windows does not have, and the daemon won't start. (The FFmpeg
        # DLLs only need the UCRT, which ships with Windows 10+.)
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release

      # ---- WinUI 3 app (unpackaged, self-contained) --------------------------
      # WinUI resource generation runs the PRI MSBuild task
      # (Microsoft.Build.Packaging.Pri.Tasks.dll), which is a .NET *Framework*
      # assembly. `dotnet build` hosts MSBuild on .NET (Core) and cannot load it
      # → MSB4062. Visual Studio's msbuild.exe is .NET Framework and loads it, so
      # build the WinUI project with VS MSBuild. The .NET 10 SDK is still needed
      # for the net10.0 target resolver.
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore WinUI app
        working-directory: windows/winui
        run: msbuild LibrePods.WinUI/LibrePods.WinUI.csproj -t:Restore -p:Configuration=Release -p:Platform=x64

      - name: Build WinUI app
        working-directory: windows/winui
        run: msbuild LibrePods.WinUI/LibrePods.WinUI.csproj -t:Build -p:Configuration=Release -p:Platform=x64 -p:RestorePackages=false

      # ---- Collect + upload artifacts ----------------------------------------
      - name: Assemble install folder
        shell: pwsh
        run: |
          # make-dist.ps1 is the one place that knows the installer's layout (the
          # local dist uses it too), and it fails if any file install.ps1 needs is
          # missing — so an incomplete bundle can't be uploaded again.
          # Find the WinUI output dir by locating the exe (path varies with TFM/RID).
          $exe = Get-ChildItem -Recurse -Filter librepods-winui.exe `
            windows/winui/LibrePods.WinUI/bin | Select-Object -First 1
          if (-not $exe) { throw "WinUI build output (librepods-winui.exe) not found" }
          ./windows/installer/make-dist.ps1 -Out "$env:GITHUB_WORKSPACE/dist" `
            -DaemonExe windows/daemon/target/release/librepodsd.exe `
            -WinUIDir $exe.Directory.FullName

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: librepods-windows-frontend
          path: dist
          if-no-files-found: error

      # ---- Releases --------------------------------------------------------
      # push to windows-native → rolling "windows-nightly" pre-release, rebuilt on
      #                          every push and pointing at that commit.
      # push a windows-v* tag   → a versioned release.
      # PRs and other branches only get the Actions artifact above.
      - name: Package release zip
        if: startsWith(github.ref, 'refs/tags/windows-v') || (github.event_name == 'push' && github.ref == 'refs/heads/windows-native')
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath LibrePods-Windows.zip

      - name: Publish nightly pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/windows-native'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Recreate instead of editing, so the tag moves to this commit too.
          gh release delete windows-nightly --cleanup-tag --yes 2>$null
          $global:LASTEXITCODE = 0
          $notes = @"
          Automatic build of ``windows-native`` at ${{ github.sha }}.

          Extract the zip, then in an **admin** PowerShell inside the folder:
          ``powershell -ExecutionPolicy Bypass -File .\install.ps1``
          (Test Mode must be on first — see windows/README.md.)
          "@
          gh release create windows-nightly LibrePods-Windows.zip `
            --target ${{ github.sha }} --prerelease --latest=false `
            --title "LibrePods for Windows (nightly)" --notes $notes
          if ($LASTEXITCODE) { throw "gh release create failed ($LASTEXITCODE)" }

      - name: Create versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/windows-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LibrePods for Windows ${{ github.ref_name }}
          files: LibrePods-Windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
